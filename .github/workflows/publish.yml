name: Publish

on:
  release:
    types: [published]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:unit

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing for auth (not just provenance) requires npm >= 11.5.1.
      # Node 22 LTS ships with npm 10.x, so upgrade explicitly.
      - run: npm install --global npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm run build
      # Auth + provenance both via OIDC; Trusted Publisher must be set up at
      # https://www.npmjs.com/package/@gachlab/devup/access  →  no NODE_AUTH_TOKEN needed.
      - run: npm publish --access public --provenance