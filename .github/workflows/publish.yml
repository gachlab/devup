name: Publish

on:
  release:
    types: [published]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run test:unit

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # OIDC trusted publishing for auth (not just provenance) requires npm >= 11.5.1.
          # Node 22 ships with npm 10.x; Node 24 ships with npm 11.x natively, so we use
          # 24 here to skip the global npm upgrade step that has been failing with
          # `Cannot find module 'promise-retry'` mid-upgrade on the GitHub runners.
          # Test job stays on 22 (matches the project's stated `engines.node`).
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm --version
      - run: npm ci
      - run: npm run build
      # Auth + provenance both via OIDC; Trusted Publisher must be set up at
      # https://www.npmjs.com/package/@gachlab/devup/access  →  no NODE_AUTH_TOKEN needed.
      - run: npm publish --access public --provenance