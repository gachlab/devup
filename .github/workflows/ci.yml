name: CI

on:
  push:
    branches: [main, '**']
  pull_request:
    branches: [main]

jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit

  integration:
    # Runs on every branch, not only on main. The integration suite is where
    # anything that binds a port, spawns a process or speaks over the control
    # plane is actually exercised — a proxy handing a port back to a process, a
    # daemon answering an RPC, `--once` tearing itself down. Gating it on `main`
    # meant a PR could go green on unit tests alone and surface those failures
    # after the merge, in the one place where reverting is expensive.
    needs: unit
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Integration tests
        run: npm run test:integration
